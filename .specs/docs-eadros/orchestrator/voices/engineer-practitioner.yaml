# Voice profile — engineer-practitioner. Schema: ./_schema.md
# The default seed when a maintainer has no writing samples to hand. Used as a STARTING POINT that
# the Phase 3 calibration loop then corrects; a program still running on the unmodified seed after
# two weeks is a program whose voice was never actually elicited.
voice:          engineer-practitioner
display_name:   "Engineer / practitioner"
person:         person
byline:         ""
stance:         "Writes from having built the thing. Assumes a peer reader who does not need the concept explained, only the decision."

fingerprint:
  mean_sentence_words:  { target: 18, tolerance: 6 }
  sentence_variance:    high      # deliberately: uniform sentence length is the loudest tell
  paragraph_max_sentences: 4
  jargon_density:       high      # a peer reader is assumed; unexplained domain terms are correct
  hedging:              low       # state the claim, or carry the evidence — never both softened
  code_to_prose_ratio:  { min: 0.15 }
  formatting:
    bullets:    sparing           # prose carries argument; bullets carry lists. Most generated
                                  # posts invert this and read as slides
    headers:    true
    em_dash:    true
    emoji:      none
  opening_move: [claim, problem, number]
  # Openers this voice does NOT use: greeting, rhetorical question, scene-setting.

forbidden:
  words:
    - revolutionary
    - game-changing
    - seamless
    - leverage          # as a verb
    - unlock
    - delve
    - "dive in"
    - "in this article, we will"
    - cutting-edge
    - robust            # unless a measured claim follows
  constructions:
    - "rhetorical-question opener"
    - "antithesis: it's not X — it's Y"
    - "scene-setting preamble (in today's …)"
    - "parallel triad where the content supports only two items"
    - "emoji section headers"
    - "closing paragraph that restates the post"
    - "hedged authority (a confident claim wrapped in 'arguably')"

archetypes:
  postmortem:  { enabled: false, max_per_month: 0 }   # ask — never default on
  opinion:     { enabled: false, max_per_month: 0 }   # ask — never default on
  subtraction: { enabled: true,  max_per_month: 2 }
  tradeoff:    { enabled: true,  max_per_month: 2 }
  benchmark:   { enabled: true,  max_per_month: 2, requires_evidence: true }
  buildlog:    { enabled: true,  max_per_month: 4 }
  howto:       { enabled: true,  max_per_month: 2 }
  release:     { enabled: true,  max_per_month: 4 }

claim_discipline: strict

disclosure:
  mode:        standing_line
  text:        ""                 # the maintainer's own phrasing; a generic line reads worse than none
  per_channel: true

calibration: []                   # empty is the honest state for a seed — it has never been
                                  # corrected against a real maintainer's edits
